description: >-
  FinOps view of FarmLogs spend: there is none to track as a standalone line
  item. FarmLogs was acquired by Bushel in June 2021 and the brand was retired
  in March 2023 in favor of Bushel Farm; farmlogs.com now redirects through
  bushelfarm.com to bushelpowered.com. There is no metered public API and no
  published FarmLogs-branded invoice or price list to reconcile against the
  FOCUS spec. Any current spend a farm incurs for this lineage of software
  would be billed by Bushel under the Bushel Farm product, not FarmLogs.
notes: >-
  This artifact is intentionally thin: it documents the absence of a
  reconcilable FarmLogs cost surface rather than modeling fabricated meters.
  Verify current Bushel Farm commercial terms directly with Bushel if cost
  data is ever needed.
