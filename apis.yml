aid: farmlogs
url: https://raw.githubusercontent.com/api-evangelist/farmlogs/refs/heads/main/apis.yml
name: FarmLogs
kind: company
description: FarmLogs was a farm management platform founded in 2011 (by Jesse Vollmar
  and Brad Koch, operating as AgriSight Inc.) offering field mapping, in-season
  satellite imagery, weather/rainfall tracking, yield estimation, and profitability
  tools for row-crop farmers. FarmLogs was acquired by Bushel in June 2021, and in
  March 2023 Bushel retired the FarmLogs brand in favor of "Bushel Farm," the next
  generation of its farm management software. As of this review, farmlogs.com
  301-redirects to bushelfarm.com, which itself redirects to bushelpowered.com -
  the standalone FarmLogs product and website no longer exist. Bushel does publish
  a public API, but it is for a separate product line (Bushel Fulfillment and
  Bushel Production, covering grain contracts and scale-ticket data for grain
  merchandising) rather than for the FarmLogs-lineage farm-management capabilities
  (fields, imagery, weather, yield). No self-serve, openly documented public API
  exists for the farm-management product as of the review date.
