apis:
- aid: farmlogs:fields
  name: FarmLogs Fields
  tags:
  - Fields
  - Mapping
  - Boundaries
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bushelpowered.com/solutions/farm-management/
  properties:
  - url: https://bushelpowered.com/solutions/farm-management/
    type: Documentation
  - url: openapi/farmlogs-openapi.yml
    type: OpenAPI
  description: Field boundary mapping and per-field record-keeping, the original
    core of FarmLogs. This capability now lives inside Bushel Farm (formerly
    Bushel Farm/FarmLogs); no self-serve public REST reference, base URL, or
    endpoint catalog has ever been published for it.
- aid: farmlogs:satellite-imagery
  name: FarmLogs Satellite Imagery / NDVI
  tags:
  - Satellite Imagery
  - NDVI
  - Crop Health
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bushelpowered.com/solutions/farm-management/
  properties:
  - url: https://bushelpowered.com/solutions/farm-management/
    type: Documentation
  - url: openapi/farmlogs-openapi.yml
    type: OpenAPI
  description: In-season multispectral satellite imagery used to spot yield
    threats, stress, and management issues field-by-field. A marquee FarmLogs
    feature historically; no openly documented public imagery API endpoints
    were ever published, and the standalone FarmLogs product no longer exists.
- aid: farmlogs:weather
  name: FarmLogs Weather & Rainfall
  tags:
  - Weather
  - Rainfall
  - Field-Level
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bushelpowered.com/farmers
  properties:
  - url: https://bushelpowered.com/farmers
    type: Documentation
  - url: openapi/farmlogs-openapi.yml
    type: OpenAPI
  description: Field-level rainfall and weather tracking with season-over-season
    comparisons. Bushel Farm continues to market a "Stop Checking Your Rain
    Gauges" rainfall feature descended from FarmLogs, but exposes it only inside
    the product, not through a documented public API.
- aid: farmlogs:yield-and-profitability
  name: FarmLogs Yield & Profitability
  tags:
  - Yield
  - Profitability
  - Cost Of Production
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bushelpowered.com/solutions/farm-management/
  properties:
  - url: https://bushelpowered.com/solutions/farm-management/
    type: Documentation
  - url: openapi/farmlogs-openapi.yml
    type: OpenAPI
  description: Yield tracking, cost-of-production, and field/crop/farm-level
    profit-and-loss calculations. Bushel Farm's marketing page notes production
    records can be shared "into your ERP or database using an API connection,"
    but no self-serve developer reference, base URL, or authentication scheme
    is published.
- aid: farmlogs:activities-and-scouting
  name: FarmLogs Activities & Scouting
  tags:
  - Activities
  - Scouting
  - Field Notes
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bushelpowered.com/solutions/farm-management/
  properties:
  - url: https://bushelpowered.com/solutions/farm-management/
    type: Documentation
  - url: openapi/farmlogs-openapi.yml
    type: OpenAPI
  description: Field activity logging and in-field scouting notes, plus
    machine/equipment activity ingested from John Deere Operations Center and
    Climate FieldView integrations. These are inbound partner integrations into
    Bushel Farm, not an outbound public API for third-party developers.
