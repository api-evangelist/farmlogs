actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public API surface (REST, WebSocket, or otherwise) exists for FarmLogs
    or its Bushel Farm successor to model. The catalog documents the
    historical FarmLogs product surfaces honestly, marks pricing/rate-limit/
    FinOps artifacts as unreconciled, and records the acquisition and rebrand
    so the operating status is clear to anyone consulting this entry.
